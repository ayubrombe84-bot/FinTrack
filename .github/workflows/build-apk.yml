
name: Build FinTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FinTrack-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract FinTrack source
        run: unzip -q FinTrack-Android-Source.zip
      - name: Fix GradientDrawable import
        run: sed -i '/^package /a import android.graphics.drawable.GradientDrawable;' 
        FinTrack/app/src/main/java/com/fintrack/app/MainActivity.java
        
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: FinTrack
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-debug-apk
          path: FinTrack/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
